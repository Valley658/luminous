[package]
name = "pastellive-image-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pastellive-image-service"
path = "src/main.rs"

[dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
