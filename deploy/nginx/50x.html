<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잠시만 기다려주세요 - 루미너스</title>
<meta http-equiv="refresh" content="3">
<style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0f0f0f; color: #fff; font-family: -apple-system, "Malgun Gothic", sans-serif; }
    .box { text-align: center; padding: 40px; max-width: 420px; }
    .spinner { width: 40px; height: 40px; margin: 0 auto 24px; border-radius: 50%;
               border: 3px solid #333; border-top-color: #38bdf8; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { font-size: 14px; color: #aaa; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>잠시 후 다시 시도해주세요</h1>
        <p>사이트를 업데이트하는 중입니다.<br>보통 몇 초 안에 끝나며, 이 화면은 자동으로 새로고침됩니다.</p>
    </div>
</body>
</html>
